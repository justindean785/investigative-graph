# MongoDB only — for local dev and tests when you do not have mongod installed.
# Usage: docker compose -f docker-compose.mongodb.yml up -d
# Stop:  docker compose -f docker-compose.mongodb.yml down
version: "3.9"

services:
  mongodb:
    image: mongo:7
    container_name: trace_analyst_mongodb
    ports:
      - "27017:27017"
    volumes:
      - trace_analyst_mongo_data:/data/db
    restart: unless-stopped

volumes:
  trace_analyst_mongo_data:
