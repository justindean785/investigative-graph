name: CI

on:
  push:
    branches: ["main", "copilot/**", "cursor/**"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install MongoDB
        run: |
          curl -fsSL https://www.mongodb.org/static/pgp/server-7.0.asc | \
            sudo gpg -o /usr/share/keyrings/mongodb-server-7.0.gpg --dearmor
          echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-7.0.gpg ] \
            https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/7.0 multiverse" | \
            sudo tee /etc/apt/sources.list.d/mongodb-org-7.0.list
          sudo apt-get update -qq
          sudo apt-get install -y mongodb-org
          mongod --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Lint backend
        run: python -m flake8 backend/server.py --max-line-length=150

      - name: Run backend tests
        run: |
          python -m pytest backend/tests/ -v --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
          BACKEND_URL: http://localhost:8001
          API_KEY: ci-test-api-key
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: trace_analyst_ci
          CORS_ORIGINS: http://localhost:3000

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile

      - name: Build
        working-directory: frontend
        env:
          REACT_APP_BACKEND_URL: https://ci-build.example.invalid
          REACT_APP_API_KEY: ci-dummy-api-key
        run: yarn build
